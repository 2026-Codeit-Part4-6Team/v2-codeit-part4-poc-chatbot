# AdCopilot POC — FastAPI 백엔드 + Streamlit 프론트 통합 실행
# 강의 Ch11.6 docker-compose 패턴을 우리 프로젝트에 맞게 조정.
# 실행:  docker compose up -d --build   →  프론트 http://localhost:8501
version: "3.9"   # (최신 docker compose에선 생략 가능. 강의 자료와 맞추려 유지)

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # 비밀값은 이미지에 굽지 않고 .env 로 주입(Ch8.4 / Ch12 Secret 원칙).
    # 루트 .env 에 OPENAI_API_KEY / NAVER_CLIENT_ID / NAVER_CLIENT_SECRET / API_KEYS 정의.
    # (키가 비어 있어도 앱은 오프라인 목 모드로 동작하도록 만들어져 있음)
    env_file:
      - .env
    volumes:
      # Bind Mount(Ch11.5): app.db 와 output/ 이미지가 컨테이너를 지워도 호스트에 남음
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      # Compose 네트워크에선 서비스 이름이 곧 호스트명 → localhost 아님(Ch11.6)
      - BACKEND_URL=http://backend:8000
      # 백엔드 API_KEYS 중 하나와 반드시 일치해야 함(루트 .env 의 API_KEY 로 주입)
      - API_KEY=${API_KEY:-}
    volumes:
      # [우리 프로젝트 전용] 유료 생성 이미지 공유.
      #   백엔드가 /app/output/xxx.png(절대경로)를 반환하고 Streamlit이 st.image로 그린다.
      #   컨테이너가 분리돼 있으므로, 백엔드가 쓴 그 경로를 프론트도 같은 경로로 봐야 한다.
      #   → 백엔드의 output 을 프론트의 동일 경로에 읽기전용으로 마운트.
      - ./backend/output:/app/output:ro
    depends_on:
      - backend
      # depends_on 은 backend "시작"만 보장하고 "완전 준비"까지는 아님.
      # → streamlit_app.py 가 연결 실패 시 에러 메시지를 띄우도록 이미 방어돼 있음.
